# Written by DocSpring/docspring's api_clients/scripts/generate from api_clients/github_workflows/java/release.yml:
# change it there.
#
# Builds the package on every push and pull request. A v* tag (pushed by the monorepo's api_clients/scripts/release)
# also signs it and publishes it to Maven Central, in the release environment, and waits until Maven Central serves
# it. Maven Central has no trusted publishing: the release environment's secrets hold a Central Portal user token
# (MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD) and the signing key (MAVEN_GPG_PRIVATE_KEY, MAVEN_GPG_PASSPHRASE).
# OpenAPI Generator's maven.yml runs the package's tests.
name: Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # The runner's Maven is 3.10, which puts maven-metadata-local.xml and _remote.repositories in the bundle the
      # Central publishing plugin (0.10.0) uploads, and Central rejects it. Maven 3.9 doesn't.
      - name: Install Maven 3.9.16
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maven.tar.gz" https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          VERSION="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but the package version is $VERSION"
            exit 1
          fi
      - run: mvn -B -ntp -DskipTests -DskipITs package

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    steps:
      # Maven builds, signs and uploads the package from the source in one deploy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      # The runner's Maven is 3.10, which puts maven-metadata-local.xml and _remote.repositories in the bundle the
      # Central publishing plugin (0.10.0) uploads, and Central rejects it. Maven 3.9 doesn't.
      - name: Install Maven 3.9.16
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maven.tar.gz" https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      # The sign-artifacts profile signs with the imported key, and the Central publishing plugin publishes the upload
      # once Central has validated it (autoPublish)
      - run: mvn -B -ntp -DskipTests -DskipITs -P sign-artifacts -DperformRelease=true clean deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # Maven Central can take an hour to serve a published release
      - name: Wait until Maven Central serves the version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for _ in $(seq 120); do
            if curl -fsS -o /dev/null "https://repo1.maven.org/maven2/com/docspring/DocSpring/$VERSION/DocSpring-$VERSION.pom"; then
              echo "Maven Central serves com.docspring:DocSpring $VERSION"
              exit 0
            fi
            sleep 30
          done
          echo "::error::Maven Central doesn't serve com.docspring:DocSpring $VERSION after an hour"
          exit 1
